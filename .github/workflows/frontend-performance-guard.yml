name: Frontend Performance Guard

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-performance-guard.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-performance-guard.yml"

jobs:
  performance-guard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Duplicate file check
        run: npm run check:duplicates

      - name: Import boundary check
        run: npm run check:imports

      - name: Test
        run: npm run test -- --run

      - name: Build
        run: npm run build

      - name: Performance gate (Warn on PR)
        if: github.event_name == 'pull_request'
        run: npm run perf:gate:warn

      - name: Performance gate (Hard fail on main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run perf:gate:hard
